<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Doppelrand Shell -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="3" />
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />

  <!-- 3D Isometric Cube / Print Volume -->
  <g transform="translate(256, 260)" filter="url(#glow)">
    <!-- Top Face -->
    <path d="M 0 -110 L 110 -45 L 0 20 L -110 -45 Z" fill="#10b981" fill-opacity="0.85" stroke="#34d399" stroke-width="4" stroke-linejoin="round" />
    <!-- Left Face -->
    <path d="M -110 -45 L 0 20 L 0 145 L -110 80 Z" fill="#064e3b" fill-opacity="0.9" stroke="#059669" stroke-width="4" stroke-linejoin="round" />
    <!-- Right Face -->
    <path d="M 0 20 L 110 -45 L 110 80 L 0 145 Z" fill="#047857" fill-opacity="0.9" stroke="#10b981" stroke-width="4" stroke-linejoin="round" />
    <!-- Inner Print Layers Accent -->
    <path d="M -75 40 L 0 85 L 75 40" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8" />
  </g>

  <!-- Extruder / Nozzle Accent at top -->
  <path d="M 236 75 L 276 75 L 264 125 L 256 140 L 248 125 Z" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="3" />
  <circle cx="256" cy="144" r="5" fill="#38bdf8" filter="url(#glow)" />
</svg>
